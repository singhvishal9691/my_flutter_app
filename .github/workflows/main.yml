name: Flutter Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        # Isme humne --no-tree-shake-icons joda hai jo kai baar error rok deta hai
        run: flutter build apk --release --no-tree-shake-icons
